name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "dev" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build documentation
        run: |
          mkdir -p docs/_build/html
          cd docs
          mkdir _build
          echo '<!DOCTYPE html>
          <html>
            <head>
              <title>Coming Soon - Documentation</title>
            </head>
            <body>
              <h1>Documentation Coming Soon</h1>
              <p>This documentation site is under construction.</p>
              <hr>
              <footer>
                <small>Generated by GitHub Actions</small>
              </footer>
            </body>
          </html>' > docs/_build/html/index.html

          # sphinx-quickstart -q -p "Your Project Name" -a "Your Name" -v 1.0 -r 1.0 -l en --ext-autodoc --ext-viewcode --makefile --batchfile -d _build
          # make html


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
